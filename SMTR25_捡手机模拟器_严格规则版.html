#333}.appbar h2{font-size:16px;margin:0;flex:1;text-align:center}.appbar .rightaction{border:0;background:none;font-size:18px;cursor:pointer}.subtabs{display:flex;justify-content:space-around;padding:10px 3px;background:#fafafd;border-bottom:1px solid var(--line);font-size:11px;color:#73737e}.listrow{display:flex;gap:11px;padding:12px;border-bottom:1px solid #e9e9ee;align-items:center;background:#fff;cursor:pointer;color:#24242a;text-align:left;width:100%;border-top:0;border-left:0;border-right:0}.avatar{width:43px;height:43px;border-radius:50%;background:#ded8ef;color:#5d527f;display:grid;place-items:center;flex-shrink:0;font-size:16px;font-weight:700}.listmain{min-width:0;flex:1}.listtitle{font-weight:650;font-size:13px;display:flex;justify-content:space-between;gap:6px}.listpreview{font-size:11px;color:#858590;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tinytime{font-size:10px;color:#999;white-space:nowrap}.badge{font-size:10px;background:#ef5365;color:#fff;padding:2px 6px;border-radius:10px}.chatwall{background-color:#e4edf2;background-image:linear-gradient(45deg,#fff9 25%,transparent 25%),linear-gradient(-45deg,#fff9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff9 75%),linear-gradient(-45deg,transparent 75%,#fff9 75%);background-size:22px 22px;background-position:0 0,0 11px,11px -11px,-11px 0;flex:1;overflow:auto;padding:12px 9px}.datepill{margin:5px auto 13px;text-align:center;font-size:10px;background:#ffffffb5;color:#686873;border-radius:12px;padding:5px 10px;width:max-content}.msg{display:flex;gap:6px;align-items:flex-end;margin:7px 0}.msg.me{justify-content:flex-end}.msg .bubble{max-width:78%;border-radius:14px;background:#fff;padding:8px 9px;font-size:12px;line-height:1.5;box-shadow:0 1px 1px #0001;white-space:pre-wrap;overflow-wrap:anywhere}.msg.me .bubble{background:#fee500;border-top-right-radius:4px}.msg:not(.me) .bubble{border-top-left-radius:4px}.translation{display:block;margin-top:4px;color:#4f4f57;fo </style></head><body><main class="wrap"><header class="intro"><h1>SMTR25 · 捡手机模拟器</h1><p>平行世界虚构设定｜你是一名意外捡到手机的路人，只能通过屏幕中实际显示的内容拼凑故事。所有可点选入口都在手机内。</p></header><div class="layout"><section><div class="phone"><div class="screen"><div class="status"><span id="statusTime">19:00</span><span class="island"></span><span class="right">▮▮  Wi-Fi  <span id="batteryText">80%</span></span></div><div id="view" class="view"></div><div class="homebar" id="homebar"></div></div></div><div class="outside" id="outside"><h3>手机档案</h3><div id="outsideText">完成右侧设置后，先生成手机档案，再打开手机开始浏览。</div></div></section><aside class="tools" id="setup"><h2>开始前的手机档案</h2><p>按顺序填写。意中人由你自行选择；不选也可以先保存设置，之后再补充。</p><div class="field"><label>粉圈资历</label><div class="chips" id="fanChips"><button class="chip" data-value="路人粉">路人粉</button><button class="chip" data-value="资深粉">资深粉</button><button class="chip" data-value="显微镜粉">显微镜粉</button><button class="chip selected" data-value="自定义">自定义</button></div></div><div class="field"><label>消息语言</label><select id="language"><option value="A">韩文原文＋简体中文翻译</option><option value="B">韩文原文，不附翻译</option><option value="C">直接以简体中文呈现（保留韩式口语）</option></select></div><div class="field"><label>机主（可自定义）</label><input id="owner" value="自定义机主" placeholder="姓名／艺名／昵称"></div><div class="field"><label>意中人（15位成员中自行选择）</label><select id="crush"><option value="">暂不选择</option></select></div><div class="field"><label>你希望的关系现状（不选则留白）</label><select id="relationship"><option value="">暂不设定</option><option>暧昧未挑明</option><option>秘密交往中</option><option>单方面暗恋</option><option>分分合合</option><option>已分开但仍有牵挂</option><option>自定义</option></select></div><div class="field"><label>两人关系补充（可选）</label><textarea id="relExtra" placeholder="关系基调、紧张点；留空不预设"></textarea></div><div class="twocol"><div class="field"><label>捡到地点</label><input id="place" value="餐厅"></div><div class="field"><label>捡到时间</label><input id="foundTime" value="19:00"></div></div><div class="twocol"><div class="field"><label>手机型号</label><input id="model" value="iPhone 18 Pro Max"></div><div class="field"><label>电量（%）</label><input id="battery" type="number" min="1" max="100" value="80"></div></div><div class="field"><label>活动日期／时间背景</label><input id="eventDate" value="2026-10-23 · 回归准备期"></div><div class="field"><label>锁屏壁纸</label><select id="wallpaper"><option value="dots">灰色竖条纹＋浅粉圆点（参考图）</option><option value="upload">自定义上传</option></select><input type="file" id="wallUpload" accept="image/*" class="hidden"></div><div class="field"><label>聊天背景</label><select id="chatwall"><option value="gingham">蓝白格（参考图）</option><option value="upload">自定义上传</option></select><input type="file" id="chatUpload" accept="image/*" class="hidden"></div><div class="field"><label>成员头像（每人单独上传，可选）</label><div id="avatarUploads" class="field"></div></div><div class="field"><label>团体照片（可选）</label><input type="file" id="groupUpload" accept="image/*"></div><div class="actions"><button class="primary" id="makeProfile">生成手机档案</button><button class="secondary" id="openPhone" disabled>打开手机</button><button class="secondary" id="restart">重新开始</button></div><div class="toast" id="setupToast"></div><div class="notice">说明：这是本地浏览器原型。上传图片只用于当前页面预览，不会上传服务器；刷新后可能需要重新上传。消息为平行世界虚构示例，不是现实爆料。</div></aside></div></main><script>
const MEMBERS=['李松河','李鹤来','李河民','李丹尼尔','李翰飞','Justin','吴弦俊','Haruta','查理','Kachin','Tata','Sadaharu','金雨霖','Jaewon','Kassho'];
const APPS=[['KakaoTalk','카카오톡','💬'],['Instagram','Instagram','📷'],['X','X','𝕏'],['Threads','Threads','＠'],['Weverse','위버스','💜'],['Bubble','Bubble','🫧'],['电话','전화','📞'],['备忘录','메모','📝'],['日历','캘린더','🗓️'],['购物／外卖','쇼핑','🛍️'],['相册','사진','🌄'],['联系人','연락처','👥'],['设置','설정','⚙️'],['相机','카메라','📸'],['音乐','음악','🎵'],['Safari','Safari','🧭']];
const $=id=>document.getElementById(id);let state={stage:'setup',app:null,page:null,chat:null,profile:null,fan:'自定义',wallUrl:null,chatUrl:null,avatars:{},groupUrl:null,history:{},seen:{},turn:0,sync:false, battery:80};
const names=['意中人','同团室友','练习生同期','엄마','매니저 형','🫧','全员群','댄스 바보들','오늘 밥 뭐 먹지','스케줄 공유','97들 모여라','우리가족','연습생 시절 흑역사','跨团好友','制作팀'];
const kor=[['오늘 연습 몇 시에 끝나?','今天练习几点结束？'],['아직 안 끝났어 ㅠㅠ','还没结束ㅠㅠ'],['밥은 먹었어?','吃饭了吗？'],['ㅇㅇ 대충 먹었어ㅋㅋ','嗯嗯，随便吃了ㅋㅋ'],['대충 먹지 말라고 했잖아','不是说了别随便吃吗'],['알았어 잔소리 그만 ㅎㅎ','知道啦，别念了ㅎㅎ'],['내일 리허설 자료 확인했어?','明天彩排资料看了吗？'],['응. 너 것도 같이 봤어','嗯，也顺便看了你的'],['왜 내 것까지 봐ㅋㅋ','干嘛连我的也看ㅋㅋ'],['틀린 데 있어서','因为有错的地方'],['아 그건 말하지 마…','啊那个别说了…'],['ㅋㅋㅋㅋㅋㅋ','ㅋㅋㅋㅋㅋㅋ'],['오늘 비 온대. 우산 챙겨','听说今天下雨，带伞'],['너도 챙겨. 맨날 두고 다니잖아','你也带，你总是忘'],['이번엔 진짜 챙김','这次真的会带'],['사진','照片'],['이거 네 거 아니야?','这个不是你的吗？'],['어? 어디서 찾았어','诶？在哪找到的'],['그냥 가방 옆에 있었어','就在包旁边'],['고마워. 나중에 줄게','谢了，之后给你']];
const daily=[['오늘 안무 동선 또 바뀜…','今天舞蹈走位又改了…'],['나 왼쪽인지 오른쪽인지 아직도 헷갈려','我到现在还分不清左边右边'],['ㅋㅋ 연습실 바닥에 테이프 붙여놔','ㅋㅋ在练习室地上贴胶带吧'],['저녁 뭐 먹을래','晚饭吃什么'],['마라탕 vs 김치찌개','麻辣烫还是泡菜汤'],['난 둘 다 가능','我两个都可以'],['그게 제일 어려운 대답이야','这就是最难回答的答案'],['오늘 녹음 디렉팅 길었다','今天录音指导好久'],['가이드 파일 보내줄게','我把导唱文件发你'],['오케이 내일 아침에 들을게','好，明早听'],['아침에? 너 일어나긴 해?ㅋㅋ','早上？你起得来吗ㅋㅋ'],['그건 비밀','那是秘密'],['엄마가 반찬 보내셨대','妈妈说寄了小菜'],['헐 나도 먹고 싶다','哇我也想吃'],['다음에 남겨둘게','下次给你留'],['새 신발 왔어?','新鞋到了吗？'],['왔는데 사이즈 교환해야 돼','到了，但要换尺码'],['택배 박스 버리지 마 영수증 있어','快递盒别扔，里面有收据'],['넵 선생님','好的老师'],['ㅋㅋㅋㅋㅋㅋㅋㅋ','ㅋㅋㅋㅋㅋㅋㅋㅋ']];
function timeFor(i){let base=new Date('2026-10-21T10:04:00');base.setMinutes(base.getMinutes()+i*13+(i%7)*4);return base.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})+' '+base.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})}
function fillMemberSelect(){MEMBERS.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;$('crush').appendChild(o)});$('avatarUploads').innerHTML=MEMBERS.map((n,i)=>`<div class="twocol"><label style="font-size:11px;align-self:center">${n}</label><input type="file" accept="image/*" data-avatar="${i}" aria-label="上传${n}头像"></div>`).join('');}
function previewFile(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
$('fanChips').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.fan=b.dataset.value;$('fanChips').querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))});$('wallpaper').onchange=()=> $('wallUpload').classList.toggle('hidden',$('wallpaper').value!=='upload');$('chatwall').onchange=()=> $('chatUpload').classList.toggle('hidden',$('chatwall').value!=='upload');$('wallUpload').onchange=e=>previewFile(e.target.files[0],v=>state.wallUrl=v);$('chatUpload').onchange=e=>previewFile(e.target.files[0],v=>state.chatUrl=v);$('groupUpload').onchange=e=>previewFile(e.target.files[0],v=>state.groupUrl=v);$('avatarUploads').onchange=e=>{let f=e.target.files[0],i=e.target.dataset.avatar;if(f!==undefined)previewFile(f,v=>state.avatars[i]=v)};
function profileObj(){return {fan:state.fan,language:$('language').value,owner:$('owner').value||'自定义机主',crush:$('crush').value,relationship:$('relationship').value,relExtra:$('relExtra').value,place:$('place').value,foundTime:$('foundTime').value,model:$('model').value,battery:Math.max(1,Math.min(100,Number($('battery').value)||80)),eventDate:$('eventDate').value,wallpaper:$('wallpaper').value,chatwall:$('chatwall').value}}
$('makeProfile').onclick=()=>{state.profile=profileObj();state.battery=state.profile.battery;$('openPhone').disabled=false;$('setupToast').textContent='手机档案已生成。确认无误后点击“打开手机”。';$('outsideText').textContent=`${state.profile.model}｜${state.profile.place}｜${state.profile.foundTime}｜电量 ${state.battery}%｜背景：${state.profile.eventDate}｜意中人：${state.profile.crush||'尚未选择'}`;};
$('openPhone').onclick=()=>{if(!state.profile)return;state.stage='lock';render();$('outsideText').textContent=`你在${state.profile.place}于${state.profile.foundTime}捡到一部${state.profile.model}。屏幕未锁定，电量${state.battery}%。这是平行世界虚构故事；你只能查看屏幕上实际显示的内容。`;};$('restart').onclick=()=>{if(confirm('重新开始会清空本局浏览进度，确定吗？')){state={stage:'setup',app:null,page:null,chat:null,profile:null,fan:'自定义',wallUrl:null,chatUrl:null,avatars:{},groupUrl:null,history:{},seen:{},turn:0,sync:false,battery:80};$('openPhone').disabled=true;$('setupToast').textContent='';render();}};
function status(){ $('statusTime').textContent=state.profile?.foundTime||'19:00';$('batteryText').textContent=state.battery+'%';}
function render(){status();let v=$('view');if(state.stage==='setup'){v.innerHTML='<div class="empty">请在右侧完成设置，再生成手机档案。</div>';return}if(state.stage==='lock'){v.innerHTML=`<div class="lock" style="${state.wallUrl&&state.profile.wallpaper==='upload'?`background-image:url('${state.wallUrl}');background-size:cover;background-position:center`:''}"><div style="font-size:12px">⌑ ${state.profile.model}</div><div class="date">${state.profile.eventDate}</div><div class="bigtime">${state.profile.foundTime}</div><div class="locknote">🔔 <b>通知中心</b><br>KakaoTalk · 새 메시지（新消息）<br>你发现这部手机没有锁屏密码提示，屏幕可以滑动进入。</div><div class="lockbottom"><button class="roundbtn" aria-label="手电筒" onclick="alert('手电筒界面预览')">🔦</button><button class="primary" onclick="state.stage='home';render()">向上滑动解锁 ↑</button><button class="roundbtn" aria-label="相机" onclick="openApp('相机')">📷</button></div></div>`;return}if(state.stage==='home'){v.innerHTML=homeHTML();return}if(state.stage==='app'){v.innerHTML=appHTML();return}}
function homeHTML(){let apps=APPS.map(([en,ko,ico])=>`<button class="appicon" onclick="openApp('${en}')"><span class="glyph">${ico}</span><span>${ko}</span><small>${en==='电话'?'电话':en==='备忘录'?'备忘录':en==='日历'?'日历':en}</small></button>`).join('');return `<div class="homewall" style="${state.wallUrl&&state.profile.wallpaper==='upload'?`background-image:url('${state.wallUrl}');background-size:cover;background-position:center`:''}"><div class="homecontent"><div style="display:flex;justify-content:space-between;font-size:11px;font-weight:700;padding:3px 5px"><span>📍 ${state.profile.place}</span><span>${state.battery}% ▰</span></div><div class="widget"><b>${state.profile.eventDate}</b><br>오늘 일정 · 今日行程<br>19:30 이동 / 20:00 개인 연습（示例日程）</div><div class="appgrid">${apps}</div><div class="widget" style="margin-top:14px"><b>通知</b><br>💬 KakaoTalk · 未读消息<br>📷 Instagram · 新快拍</div><div class="dock">${[['📞','电话'],['💬','KakaoTalk'],['📷','相机'],['🌐','Safari']].map(([i,n])=>`<button class="appicon" onclick="openApp('${n}')"><span class="glyph">${i}</span></button>`).join('')}</div></div></div>`}
function appHTML(){if(state.app==='KakaoTalk')return kakaoHTML();if(['Instagram','X','Threads','Weverse','Bubble'].includes(state.app))return socialHTML();if(state.app==='电话')return listHTML('전화','通话记录',Array.from({length:18},(_,i)=>({title:['매니저 형','意中人','엄마','비공개 번호'][i%4],preview:['呼出 · 04:32','KakaoTalk语音 · 38:12','未接来电','呼入 · 00:56'][i%4],time:timeFor(i),detail:`${timeFor(i)}\n${['呼出','呼入','未接来电','无人接听'][i%4]} · ${['04:32','38:12','—','00:56'][i%4]}`})));if(state.app==='备忘录')return listHTML('메모','备忘录',Array.from({length:15},(_,i)=>({title:['녹음 체크','장보기','팬미팅 멘트','안무 수정','가사 메모','충전기','내일 일정','메시지 초안','택배 확인','보컬 연습'][i%10],preview:i===7?'未完成草稿': '最后修改 '+timeFor(i),time:timeFor(i),detail:`${timeFor(i)}\n${['가이드 다시 듣기','우유, 계란, 바나나','오늘 와줘서 고마워요','2절 동선 확인','말로 하면 쉬운데 쓰면 어렵다','가방 안쪽 주머니','리허설 15:00','보내려다가 지움…','사이즈 교환','고음 파트 다시'][i%10]}`})));if(state.app==='日历')return listHTML('캘린더','日历',Array.from({length:20},(_,i)=>({title:['舞蹈练习','音乐节目预录','录音室','广告拍摄','团体会议','海外行程确认','个人练习'][i%7],preview:`${timeFor(i)} · ${['练习室A','公司录音室','电视台','待确认'][i%4]}`,time:timeFor(i),detail:`${timeFor(i)}\n${['舞蹈练习','音乐节目预录','录音室','广告拍摄','团体会议'][i%5]}\n地点：${['练习室A','电视台','公司录音室'][i%3]}`})));if(state.app==='购物／外卖')return listHTML('주문','购物／外卖',Array.from({length:15},(_,i)=>({title:['外卖 · 김밥천국','网购 · 运动袜','咖啡 · 아아','便利店','礼品店','外卖 · 炸鸡'][i%6],preview:`${timeFor(i)} · ₩${[8500,12900,4500,3200,58000,22000][i%6].toLocaleString()} · 已完成`,time:timeFor(i),detail:`${timeFor(i)}\n订单：${['紫菜包饭＋拉面','黑色运动袜','冰美式','水和饭团','礼品包装','原味炸鸡'][i%6]}\n金额：₩${[8500,12900,4500,3200,58000,22000][i%6].toLocaleString()}\n状态：已完成`})));if(state.app==='相册')return galleryHTML();if(state.app==='联系人')return contactsHTML();if(state.app==='设置')return settingsHTML();if(state.app==='相机')return simplePage('카메라','相机','相机预览不会真实拍摄。');if(state.app==='音乐')return simplePage('음악','音乐','最近播放：연습용 플레이리스트 · 32首');if(state.app==='Safari')return simplePage('Safari','Safari','浏览记录（虚构示例）');return simplePage(state.app,state.app,'此页面为原型入口。')}
function topbar(title,back='home'){return `<div class="appbar"><button class="back" onclick="${back==='home'?"goHome()":"backList()"}">‹</button><h2>${title}</h2><button class="rightaction" onclick="alert('搜索功能为界面示例')">⌕</button></div>`}
function kakaoHTML(){if(state.page==='chat')return chatHTML();let rows=chatList();return `<div class="appview">${topbar('채팅 · 聊天')}<div class="subtabs"><span>친구 好友</span><b>채팅 聊天</b><span>오픈채팅 开放聊天</span><span>더보기 更多</span></div><div class="field" style="margin:8px;padding:0"><input style="border-radius:9px" placeholder="검색 搜索" oninput="filterChats(this.value)"></div><div id="chatrows">${rows.map((c,i)=>`<button class="listrow" data-chat-name="${c.name}" onclick="openChat('${c.name.replace(/'/g,"\\'")}')"><span class="avatar">${c.name==='意中人'?'?':c.name==='엄마'?'妈':c.name==='매니저 형'?'M':c.name.slice(0,1)}</span><span class="listmain"><span class="listtitle">${c.name}<span class="tinytime">${c.time}</span></span><span class="listpreview">${c.preview}</span></span>${i<3?'<span class="badge">1</span>':''}</button>`).join('')}</div><div class="subtabs" style="margin-top:auto"><span>친구</span><b>채팅</b><span>뷰</span><span>쇼핑</span><span>더보기</span></div></div>`}
function chatList(){return [{name:'意中人',preview:'ㅋㅋ 그건 너만 알고 있어',time:'오후 6:42'},{name:'숙소 쓰레기 당번🗑️',preview:'오늘 누가 버릴 차례야?',time:'오후 6:31'},{name:'매니저 형',preview:'내일 07:20까지 1층 집합입니다.',time:'오후 6:12'},{name:'엄마',preview:'밥은 꼭 챙겨 먹어라',time:'오후 5:58'},{name:'댄스 바보들',preview:'동선 영상 다시 올림',time:'오후 5:24'},{name:'97들 모여라',preview:'이번 주 시간 되는 사람?',time:'오후 4:45'},{name:'🫧',preview:'사진을 보냈습니다',time:'오후 3:39'},{name:'연습생 시절 흑역사',preview:'이거 아직도 가지고 있음ㅋㅋ',time:'오후 2:10'},{name:'밥 먹을 사람',preview:'난 국밥',time:'오후 1:20'},{name:'制作팀',preview:'가이드 파일 확인 부탁드립니다',time:'오전 11:02'}]}
function filterChats(q){document.querySelectorAll('[data-chat-name]').forEach(el=>el.classList.toggle('hidden',!el.dataset.chatName.toLowerCase().includes(q.toLowerCase())))}
function openChat(name){state.page='chat';state.chat=name;state.turn++;state.battery=Math.max(1,state.battery-1);if(!state.history[name])state.history[name]=makeMessages(name,150);else if(state.sync)state.history[name].push(...makeMessages(name,8,state.history[name].length));state.seen[name]=true;render();}
function makeMessages(name,count,start=0){let arr=[];for(let i=0;i<count;i++){let ix=start+i, pair=(name==='意中人'?kor:daily)[ix%(name==='意中人'?kor:daily).length];let me=(ix%3===1)||(ix%7===0);let text=pair[0],tr=pair[1];if(name.includes('🗑️')){text=['쓰레기 누가 버림?','내가 어제 했잖아','오늘은 너 차례ㅋㅋ','아 몰랐어 미안','치킨 시킬 사람?'][ix%5];tr=['谁去倒垃圾？','我昨天倒过了','今天轮到你ㅋㅋ','啊不知道，抱歉','有人点炸鸡吗？'][ix%5]}else if(name==='매니저 형'){text=['내일 07:20까지 1층 집합입니다.','네 확인했습니다!','의상 피팅 10분 당겨졌습니다.','네 알겠습니다.','이동 중에는 연락 확인 부탁드립니다.'][ix%5];tr=['明天07:20一楼集合。','好的，确认了！','服装试穿提前十分钟。','好的，明白。','移动途中请留意消息。'][ix%5]}else if(name==='엄마'){text=['밥 먹었니?','응 먹었어 ㅎㅎ','거짓말하지 말고','진짜야ㅋㅋ','날 추우니까 겉옷 입어'][ix%5];tr=['吃饭了吗？','嗯吃了ㅎㅎ','别撒谎','真的ㅋㅋ','天气冷，穿外套'][ix%5]}else if(name!=='意中人'&&name!=='숙소 쓰레기 당번🗑️'&&name!=='매니저 형'&&name!=='엄마'){text=daily[ix%daily.length][0];tr=daily[ix%daily.length][1]}
let date=timeFor(ix);arr.push({me,text,tr,time:date,kind:ix%31===0?'photo':ix%43===0?'deleted':'text',sender:me?'나':name==='意中人'?name:['Justin','李河民','Haruta'][ix%3]});}return arr}
function chatHTML(){let name=state.chat,arr=state.history[name]||[];let msgs=arr.map((m,i)=>`<div class="msg ${m.me?'me':''}">${!m.me?`<span class="avatar" style="width:26px;height:26px;font-size:10px">${(m.sender||name).slice(0,1)}</span>`:''}<div class="bubble">${m.kind==='photo'?'🖼️ 图片 · 练习室/日常照片预览（虚构示例）':m.kind==='deleted'?'삭제된 메시지（已删除的消息）':escapeHtml(m.text)}${state.profile.language==='A'?`<span class="translation">${escapeHtml(m.tr)}</span>`:state.profile.language==='C'?`<span class="translation">${escapeHtml(m.tr)}</span>`:''}</div><span class="msgmeta">${m.time.split(' ').slice(-1)[0]}</span></div>`).join('');return `<div class="appview">${topbar(name,'list')}<div class="subtabs"><span>🔍</span><span>☰</span><span>통화 语音通话</span><span>비디오 视频</span></div><div class="chatwall" id="chatScroll"><div class="datepill">2026년 10월 21일 이후 · 近期聊天</div>${msgs}<div class="datepill">当前显示 ${arr.length} 条记录 · 可向上滚动</div></div><div class="composer"><button onclick="alert('附件预览为示例')">＋</button><input placeholder="메시지 입력…（输入消息）" id="composerInput"><button onclick="sendDraft()">➤</button></div></div>`}
function sendDraft(){let inp=$('composerInput');if(!inp||!inp.value.trim())return;alert('为避免替机主执行风险行动，此原型不会发送真实消息。你可以在剧情中选择风险行动来模拟。');inp.value=''}
function socialHTML(){let app=state.app;let title=app==='Instagram'?'Instagram':app==='X'?'X':app==='Threads'?'Threads':app==='Weverse'?'Weverse':'Bubble';let count=app==='Weverse'||app==='Bubble'?15:150;let items=Array.from({length:count},(_,i)=>{let texts=app==='Instagram'?['연습 끝! 오늘도 고생했다','오늘 하늘 색 예쁘다','새 앨범 준비 중 🎧','밥 먹고 다시 연습','사진 정리하다 발견ㅋㅋ']:app==='X'?['오늘 무대 진짜 좋았다','이 조합 또 보고 싶음','무리한 해석은 자제하자','오늘 착장 어디 거지?','컴백 기다리는 중']:app==='Threads'?['오늘 커피 세 잔째','연습실 에어컨 너무 세다','이 노래 계속 맴돎','배고파…','택배 언제 와']:['오늘도 고생했어요 💜','밥 잘 챙겨 먹기 약속','오늘 연습 끝!','잘 자요 ㅎㅎ','사진 찍어뒀는데 나중에 보여줄게'];return `<div class="feeditem"><div class="feedhead"><span class="avatar">${i%3===0?'나':'?'+(i%9)}</span><div><b>${app==='Instagram'?'smtr25_official':app==='X'?'SMTR25_official':app==='Threads'?'daily_note':'SMTR25'}</b><div class="tinytime">${timeFor(i)}</div></div></div><div class="feedbody">${texts[i%texts.length]}</div>${i%3===0?'<div class="feedpic">📷　图片附件预览</div>':''}<div class="feedmeta">♡ ${124+i*7}　评论 ${8+i%22}　↗ 分享　· 虚构示例内容</div></div>`}).join('');return `<div class="appview">${topbar(title)}<div class="subtabs"><span>主页</span><span>搜索</span><span>私信</span><span>个人</span></div><div class="view" style="overflow:auto">${items}</div></div>`}
function listHTML(ko,title,items){return `<div class="appview">${topbar(ko)}<div class="subtabs"><b>${title}</b><span>검색 搜索</span><span>＋</span></div><div class="view">${items.map((it,i)=>`<button class="listrow" onclick="openDetail(${JSON.stringify(it).replace(/"/g,'&quot;')})"><span class="avatar">${it.title.slice(0,1)}</span><span class="listmain"><span class="listtitle">${it.title}<span class="tinytime">${it.time}</span></span><span class="listpreview">${it.preview}</span></span></button>`).join('')}</div></div>`}
function openDetail(obj){state.page='detail';state.detail=obj;renderDetail()}
function renderDetail(){let v=$('view');v.innerHTML=`<div class="appview">${topbar('상세 보기 · 详情','list')}<div class="detail"><b>${escapeHtml(state.detail.title)}</b>\n${escapeHtml(state.detail.detail||state.detail.preview)}\n\n${escapeHtml(state.detail.time||'')}</div></div>`}
function galleryHTML(){return `<div class="appview">${topbar('사진 · 相册')}<div class="subtabs"><b>全部</b><span>相簿</span><span>搜索</span></div><div class="view" style="padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start">${Array.from({length:24},(_,i)=>`<button onclick="openDetail({title:'照片 ${i+1}',detail:'照片预览：${['练习室地板与舞蹈鞋','蓝白格床品的一角','便利店饮料与收据','天空与建筑','外卖袋和餐桌','录音室设备'][i%6]}。未点击前不显示更多细节。',time:'${timeFor(i)}'})" style="aspect-ratio:1;border:0;border-radius:7px;background:${['#d7e7ed','#e8d5e3','#c8c4dd','#e5e0d6'][i%4]};font-size:25px">${['🖼️','🌤️','🥤','🎧','📦','🌃'][i%6]}</button>`).join('')}</div></div>`}
function contactsHTML(){return `<div class="appview">${topbar('연락처 · 联系人')}<div class="view">${[...MEMBERS,'엄마','매니저 형','댄스 선생님','制作팀'].map(n=>`<button class="listrow" onclick="openDetail({title:'${n}',detail:'联系人卡片：${n}。电话与备注信息为虚构示例。',time:'已保存'})"><span class="avatar">${n.slice(0,1)}</span><span class="listmain"><span class="listtitle">${n}</span><span class="listpreview">手机 · 已保存</span></span></button>`).join('')}</div></div>`}
function settingsHTML(){return `<div class="appview">${topbar('설정 · 设置')}<div class="view">${[['壁纸','当前为自定义预览'],['电池','电量 '+state.battery+'%'],['账号与同步',state.sync?'新机同步阶段已开启':'尚未进入新机同步阶段'],['关于本机',state.profile.model],['语言','韩文＋简体中文（按设置）']].map(([a,b])=>`<div class="listrow" style="cursor:default"><span class="avatar">⚙</span><span class="listmain"><span class="listtitle">${a}</span><span class="listpreview">${b}</span></span></div>`).join('')}</div></div>`}
function simplePage(ko,title,txt){return `<div class="appview">${topbar(ko)}<div class="detail"><b>${title}</b>\n${txt}</div></div>`}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openApp(name){if(state.stage==='lock'){state.stage='home';render();return}state.stage='app';state.app=name;state.page=null;state.chat=null;state.turn++;state.battery=Math.max(1,state.battery-1);render()}
function goHome(){state.stage='home';state.app=null;state.page=null;state.chat=null;render()}
function backList(){if(state.app==='KakaoTalk'&&state.page==='chat'){state.page=null;state.chat=null;render()}else if(state.page==='detail'){state.page=null;render()}else{goHome()}}
const oldRender=render;render=function(){if(state.stage==='app'&&state.page==='detail'){status();renderDetail();return}oldRender();if(state.stage==='app'&&state.page==='chat'){let sc=$('chatScroll');if(sc)sc.scrollTop=sc.scrollHeight}};
fillMemberSelect();render();
</script></body></html>
